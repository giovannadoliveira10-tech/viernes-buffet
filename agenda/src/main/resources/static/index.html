<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Buffet – Sistema</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i>V</i><s></s>b<small>Agenda de eventos</small></div>
  <label class="tg"><input type="checkbox" id="mask"> Modo restrito (oculta valores)</label>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="agenda">Agenda</button>
  <button role="tab" aria-selected="false" data-t="novo">Novo evento</button>
  <button role="tab" aria-selected="false" data-t="rel">Relatório</button>
</nav>

<section id="agenda">
  <h2>Agenda</h2>
  <div class="bar">
    <select id="mes" aria-label="Mês"></select>
    <select id="ano" aria-label="Ano"><option>2026</option><option>2027</option></select>
    <select id="vis" aria-label="Visualização"><option value="todos">Todos os eventos</option><option value="abertos">Só não fechados</option></select>
    <div class="leg"><span><i class="dot v"></i>Fechado</span><span><i class="dot a"></i>Orçamento</span><span><i class="dot n"></i>Não pago</span></div>
  </div>
  <div class="cal" id="cal"></div>
  <div class="card" id="det"><b>Toque em um dia</b> para ver os eventos.</div>
</section>

<section id="novo" hidden>
  <h2>Novo evento</h2>
  <h3>Clientes</h3>
  <div class="grid">
    <label><span>Cliente 1 – Nome</span><input value="Ana"></label>
    <label><span>Sobrenome</span><input value="Souza"></label>
    <label><span>E-mail</span><input type="email" value="ana@email.com"></label>
    <label><span>Telefone 1</span><input value="(15) 99999-0000"></label>
    <label><span>Telefone 2</span><input></label>
    <label><span>Cliente 2 – Nome</span><input value="Pedro"></label>
    <label><span>Sobrenome</span><input value="Lima"></label>
    <label><span>E-mail</span><input type="email"></label>
  </div>
  <h3>Evento</h3>
  <div class="grid">
    <label><span>Tipo de evento</span><select><option>Casamento</option><option>Aniversário</option><option>Formatura</option><option selected>Empresarial</option></select></label>
    <label><span>Status</span><select><option>Orçamento (amarelo)</option><option>Fechado (verde)</option><option>Não pago (vermelho)</option></select></label>
    <label><span>Data de atendimento</span><input type="date"></label>
    <label><span>Data da confirmação</span><input type="date"></label>
    <label><span>Data do evento</span><input type="date"></label>
    <label><span>Horário de início</span><input type="time" value="19:00"></label>
    <label><span>Horário de término</span><input type="time" value="23:30"></label>
  </div>
  <h3>Profissionais</h3>
  <div class="grid">
    <label><span>Cerimonialista – Nome</span><input></label><label><span>Telefone</span><input></label>
    <label><span>Organizador – Nome</span><input></label><label><span>Telefone</span><input></label>
    <label><span>DJ – Nome</span><input></label><label><span>Telefone</span><input></label>
  </div>
  <h3>Convidados</h3>
  <div class="grid">
    <label><span>Previstos</span><input type="number" value="120"></label>
    <label><span>Compareceram</span><input type="number"></label>
    <label><span>Pagantes inteiros</span><input class="g" type="number" value="90"></label>
    <label><span>Meias</span><input class="g" type="number" value="10"></label>
    <label><span>Não pagantes</span><input class="g" type="number" value="8"></label>
    <div class="tot" id="tot">Total: 108</div>
  </div>
  <h3>Valores</h3>
  <div class="grid">
    <label><span>Valor por pessoa (R$)</span><input value="180,00"></label>
    <label><span>Valor do buffet (R$)</span><input value="19.440,00"></label>
    <label><span>Valor final do contrato (R$)</span><input value="21.000,00"></label>
    <label><span>Custo variável (R$)</span><input value="7.200,00"></label>
    <label><span>Valor da venda real (R$)</span><input value="19.440,00"></label>
    <label><span>Total recebido (R$)</span><input value="9.720,00"></label>
  </div>
  <div class="card sw"><input type="checkbox" id="bar"><label for="bar" style="margin:0">Bartender (produto à parte) incluído neste evento</label></div>
  <h3>Observação</h3>
  <textarea rows="3" placeholder="Anotações sobre o evento"></textarea>
  <button class="btn" id="save">Salvar evento</button>
  <p class="note" id="msg" hidden>Protótipo: nada é gravado de verdade.</p>
</section>

<section id="rel" hidden>
  <h2>Relatório do ano</h2>
  <div class="bar"><select aria-label="Ano"><option>2026</option><option>2025</option></select></div>
  <div class="tw"><table id="tb"></table></div>
  <p class="note">Diferença = valor da venda – custo.</p>
</section>
</div>

<script src="js/app.js"></script>
</body>
</html>
